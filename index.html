<!DOCTYPE html>
<html>
    <head>
        <!-- Link your CSS file and other references here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Assignment 1 for INFO-253A- Task Manager">
    <title>Assignment 1 - Task Manager </title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="main-header">
            <h1>Task Manager</h1>
            <button class="menu-btn" type="button">
                <img src="assets/menu_icon.png" alt="Menu" class="menu-icon" />
            </button>
            <label class="search-box">
                <img src="assets/search_icon.png" alt="Search" class="search-icon" />
                <input type="text" id="quick-find" name="quick-find" class="search-input" placeholder="Quick find" />
            </label>
            
            <p class="task-counter">
                <img src="assets/check_icon.png" alt="Completed tasks" class="check-icon" />
                30/5
            </p>
        </header>
        <nav class="sidebar">
            <ul class="nav-list">
                <li>
                    <a href="#" class="nav-link active">
                        <img src="assets/inbox_icon.png" alt="" class="nav-icon" />
                        Inbox
                        <span class="nav-count">5</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link">
                        <img src="assets/calendar_icon.png" alt="" class="nav-icon" />
                        Today
                        <span class="nav-count">5</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link">
                        <img src="assets/upcoming_icon.png" alt="" class="nav-icon" />
                        Upcoming
                    </a>
                </li>
            </ul>
        </nav>
    <main class="main-content">
        <section class="task-section">
            <h1 class="section-title">Inbox</h1>
            <ul class="task-list">
                <li class="task-item">
                    <input type="radio" id="task-1" name="task-1" class="task-radio" />
                    <label for="task-1">Call Mom</label>
                </li>
                <li class="task-item">
                    <input type="radio" id="task-2" name="task-2" class="task-radio" />
                    <label for="task-2">Buy the new issue of Scientific American</label>
                </li>
                <li class="task-item">
                    <input type="radio" id="task-3" name="task-3" class="task-radio" />
                    <label for="task-3">Return the textbook to Josie</label>
                </li>
                <li class="task-item">
                    <input type="radio" id="task-4" name="task-4" class="task-radio" />
                    <label for="task-4">Buy the new album by Rake</label>
                </li>
                <li class="task-item">
                    <input type="radio" id="task-5" name="task-5" class="task-radio" />
                    <label for="task-5">Buy a gift card for Dad</label>
                </li>
            </ul>
        </section>
    </main>
    </body>
    
    </html>
